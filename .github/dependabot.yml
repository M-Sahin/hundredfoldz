# Weekly pull requests for outdated or vulnerable dependencies. Review them like any other PR:
# a dependency update is the classic way for bad code to get in.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # the app runs on Node 22 (Dockerfile, CI, Vercel): its types should match, not a newer Node
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is the new native compiler; stay on 5.x until Next.js supports it
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

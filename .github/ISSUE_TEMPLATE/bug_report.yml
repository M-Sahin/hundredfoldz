name: Bug report
description: Something on Hundredfoldz doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Include the exact error message. For a deck problem, paste the seed cards or the decklist, or a share link.
    validations: { required: true }
  - type: input
    id: where
    attributes:
      label: Where does it run?
      placeholder: e.g. hundredfoldz.app on an iPhone, your own copy on Vercel, Docker on a Raspberry Pi
  - type: checkboxes
    id: secrets
    attributes:
      label: Before you post
      options:
        - label: I removed API keys, access codes and other secrets from logs and screenshots.
          required: true
